version: "2"
type: frontend
tech_stack:
  - language: TypeScript
  - framework: React 18, Vite, React Router v6
  - styling: Tailwind CSS
  - map: Leaflet.js, react-leaflet
  - charts: Recharts
  - state: Zustand
  - http: Axios

routes:
  - path: /
    file: src/pages/ClientMap.tsx
    auth_required: false
    description: Public interactive map with infrastructure markers, category filter, territory filter, search, and statistics panel
  - path: /admin/login
    file: src/pages/admin/Login.tsx
    auth_required: false
    description: Admin login page with username/password form
  - path: /admin
    file: src/App.tsx
    auth_required: true
    description: Redirects to /admin/dashboard
  - path: /admin/dashboard
    file: src/pages/admin/Dashboard.tsx
    auth_required: true
    description: Admin dashboard with summary counts and navigation
  - path: /admin/kategori
    file: src/pages/admin/Kategori.tsx
    auth_required: true
    description: Admin category management — CRUD for infrastructure categories
  - path: /admin/infrastruktur
    file: src/pages/admin/Infrastruktur.tsx
    auth_required: true
    description: Admin infrastructure management — CRUD, photo upload, Excel import/export
  - path: /admin/statistik
    file: src/pages/admin/Statistik.tsx
    auth_required: true
    description: Admin statistics management — CRUD, Excel import/export

features:
  - name: Admin Login
    description: Admin authenticates with username and password to access the protected admin panel. JWT token is stored in localStorage.
    files:
      - src/pages/admin/Login.tsx
      - src/store/authStore.ts
      - src/lib/api.ts
    entry_route: /admin/login
    user_interactions:
      - Navigate to /admin/login
      - Fill in username field
      - Fill in password field
      - Click Masuk (Login) button
      - See error message on invalid credentials
      - Redirect to /admin/dashboard on success
    api_calls:
      - method: POST
        endpoint: /api/auth/login
    auth_required: false

  - name: Admin Dashboard
    description: Protected landing page showing summary counts for infrastructure, statistics, and categories with navigation links.
    files:
      - src/pages/admin/Dashboard.tsx
    entry_route: /admin/dashboard
    user_interactions:
      - View summary count cards
      - Click navigation links to management pages
    api_calls:
      - method: GET
        endpoint: /api/infrastruktur
      - method: GET
        endpoint: /api/statistik
      - method: GET
        endpoint: /api/kategori
    auth_required: true

  - name: Admin Category Management
    description: CRUD interface for infrastructure categories. Create/edit form with value slug, label, emoji icon, hex color, and sort order. Delete is blocked if category is in use.
    files:
      - src/pages/admin/Kategori.tsx
      - src/components/ui/Modal.tsx
      - src/components/ui/Button.tsx
      - src/components/ui/Input.tsx
    entry_route: /admin/kategori
    user_interactions:
      - View list of categories with icon, color, label, value, and usage count
      - Click Tambah button to open create modal
      - Fill in label, value (slug), color (hex or preset), icon fields
      - Submit form to create category
      - Click edit icon on a category row to open edit modal
      - Update fields and save
      - Click delete icon to delete a category
      - See error if category is in use by infrastructure
    api_calls:
      - method: GET
        endpoint: /api/kategori
      - method: POST
        endpoint: /api/kategori
      - method: PUT
        endpoint: /api/kategori/:id
      - method: DELETE
        endpoint: /api/kategori/:id
    auth_required: true

  - name: Admin Infrastructure Management
    description: Paginated CRUD table for infrastructure records. Form includes coordinate input, photo upload (drag-and-drop or URL), and territory code fields. Supports Excel import/export.
    files:
      - src/pages/admin/Infrastruktur.tsx
      - src/components/admin/FotoUpload.tsx
    entry_route: /admin/infrastruktur
    user_interactions:
      - View paginated list of infrastructure records
      - Search and filter by category and territory
      - Click Tambah button to open create form
      - Fill in name, category, address, coordinates (lat/lng), territory codes
      - Upload photo via drag-and-drop or file picker (JPG/PNG/WebP max 5MB)
      - Or enter photo URL manually
      - Save new infrastructure record
      - Click edit icon to update an existing record
      - Click delete icon and confirm to delete a record
      - Click Import to upload Excel file and see import results
      - Click Export to download filtered data as Excel
    api_calls:
      - method: GET
        endpoint: /api/infrastruktur
      - method: POST
        endpoint: /api/infrastruktur
      - method: PUT
        endpoint: /api/infrastruktur/:id
      - method: DELETE
        endpoint: /api/infrastruktur/:id
      - method: POST
        endpoint: /api/infrastruktur/import
      - method: GET
        endpoint: /api/infrastruktur/export
      - method: POST
        endpoint: /api/upload/foto
    auth_required: true

  - name: Admin Statistics Management
    description: Paginated CRUD table for statistical indicators per territory and year. Supports Excel import/export.
    files:
      - src/pages/admin/Statistik.tsx
    entry_route: /admin/statistik
    user_interactions:
      - View paginated list of statistics records
      - Filter by territory and year
      - Click Tambah to open create form
      - Fill in territory codes, indicator name, numeric value, unit, year
      - Save new statistic record
      - Click edit icon to update an existing record
      - Click delete icon and confirm to delete a record
      - Click Import to upload Excel file and see import results
      - Click Export to download filtered data as Excel
    api_calls:
      - method: GET
        endpoint: /api/statistik
      - method: POST
        endpoint: /api/statistik
      - method: PUT
        endpoint: /api/statistik/:id
      - method: DELETE
        endpoint: /api/statistik/:id
      - method: POST
        endpoint: /api/statistik/import
      - method: GET
        endpoint: /api/statistik/export
    auth_required: true

  - name: Public Interactive Map
    description: Full-screen Leaflet map with infrastructure markers, OSM/Google Satellite basemap toggle, GeoJSON boundary overlays, category filter, cascading territory filter, debounced search, and statistics panel.
    files:
      - src/pages/ClientMap.tsx
      - src/components/map/MapContainer.tsx
      - src/components/map/MarkerLayer.tsx
      - src/components/map/WilayahLayer.tsx
      - src/components/map/InfraPopup.tsx
      - src/components/map/BasemapToggle.tsx
      - src/components/filter/FilterKategori.tsx
      - src/components/filter/FilterWilayah.tsx
      - src/components/search/SearchBar.tsx
      - src/components/statistik/StatistikPanel.tsx
    entry_route: /
    user_interactions:
      - View map centered on Padang Pariaman
      - Toggle category filters to show/hide markers
      - Select Kecamatan, Nagari, Korong in cascading dropdowns
      - Type in search bar to find infrastructure by name
      - Click search result to fly map to location
      - Click marker to see popup with name, category, address, photo
      - Toggle basemap between OSM and Google Satellite
      - View statistics panel with charts updating per territory
      - On mobile, open filter and statistics via bottom sheet drawers
    api_calls:
      - method: GET
        endpoint: /api/kategori
      - method: GET
        endpoint: /api/infrastruktur
      - method: GET
        endpoint: /api/statistik
      - method: GET
        endpoint: /api/wilayah/kecamatan
      - method: GET
        endpoint: /api/wilayah/nagari
      - method: GET
        endpoint: /api/wilayah/korong
    auth_required: false

known_limitations:
  - issue: Territory names shown as code-based labels (e.g. "Kecamatan 130501") — no proper name lookup table
    location: server/src/routes/wilayah.ts
    impact: Filter dropdowns show code-based names instead of real names
  - issue: No marker clustering — all markers rendered directly
    location: src/components/map/MarkerLayer.tsx
    impact: Performance may degrade with large datasets
  - issue: Single admin account — no multi-user or RBAC support
    location: src/store/authStore.ts
    impact: All admins share one account
