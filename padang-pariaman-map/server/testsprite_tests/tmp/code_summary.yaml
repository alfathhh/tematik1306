version: "2"
type: backend
tech_stack:
  - language: TypeScript
  - framework: Express.js
  - database: PostgreSQL (via Prisma ORM)
  - auth: JWT (jsonwebtoken + bcrypt)
  - file_upload: Multer
  - excel: ExcelJS
features:
  - name: Health Check
    description: Simple health check endpoint to verify server is running
    files:
      - src/index.ts
    endpoints:
      - method: GET
        path: /api/health
        description: Returns server status and timestamp
        auth_required: false
        response_schema:
          "200":
            status: string
            timestamp: string

  - name: Authentication
    description: Admin login with JWT token issuance
    files:
      - src/routes/auth.ts
      - src/middleware/auth.ts
    endpoints:
      - method: POST
        path: /api/auth/login
        description: Login admin and return JWT token
        auth_required: false
        request_schema:
          body:
            username: string
            password: string
        response_schema:
          "200":
            token: string
            user:
              id: number
              username: string
          "400": Validation error - missing username or password
          "401": Invalid credentials
          "500": Server error

  - name: Kategori Infrastruktur Management
    description: CRUD operations for infrastructure categories
    files:
      - src/routes/kategori.ts
    endpoints:
      - method: GET
        path: /api/kategori
        description: List all categories ordered by urutan
        auth_required: false
        response_schema:
          "200": KategoriInfra[]
      - method: GET
        path: /api/kategori/:id
        description: Get single category by ID
        auth_required: true
        response_schema:
          "200": KategoriInfra
          "404": Category not found
      - method: POST
        path: /api/kategori
        description: Create new infrastructure category. Required body fields are value (string, lowercase letters and underscores only e.g. 'test_kategori'), label (string), icon (string), color (string hex #RRGGBB). Optional field urutan (number). Do NOT use 'nama' - it does not exist.
        auth_required: true
        request_schema:
          body:
            value: string (lowercase letters and underscore only, e.g. 'test_kategori')
            label: string (e.g. 'Test Kategori')
            icon: string (e.g. '📍')
            color: string (hex #RRGGBB, e.g. '#FF5733')
            urutan: number (optional)
        response_schema:
          "201": KategoriInfra
          "400": Validation error
          "409": Duplicate value
      - method: PUT
        path: /api/kategori/:id
        description: Update existing category
        auth_required: true
        request_schema:
          body:
            value: string
            label: string
            icon: string
            color: string
            urutan: number (optional)
        response_schema:
          "200": KategoriInfra
          "400": Validation error
          "404": Not found
          "409": Duplicate value
      - method: DELETE
        path: /api/kategori/:id
        description: Delete category (fails if still used by infrastruktur)
        auth_required: true
        response_schema:
          "200": Success message
          "400": Category still in use
          "404": Not found
    depends_on:
      - Authentication

  - name: Infrastruktur Management
    description: CRUD operations for infrastructure data with filtering, pagination, Excel import/export
    files:
      - src/routes/infrastruktur.ts
    endpoints:
      - method: GET
        path: /api/infrastruktur
        description: List infrastruktur with optional filters (kategori, kdkab, kdkec, kddesa, kdsls, search) and pagination
        auth_required: false
        response_schema:
          "200":
            data: Infrastruktur[]
            total: number
            page: number (if paginated)
            totalPages: number (if paginated)
      - method: GET
        path: /api/infrastruktur/export
        description: Export infrastruktur data to Excel file (admin)
        auth_required: true
        response_schema:
          "200": Excel file (.xlsx)
      - method: GET
        path: /api/infrastruktur/:id
        description: Get single infrastruktur by ID
        auth_required: false
        response_schema:
          "200": Infrastruktur
          "404": Not found
      - method: POST
        path: /api/infrastruktur
        description: Create new infrastruktur entry (admin)
        auth_required: true
        request_schema:
          body:
            nama: string
            kategori: string
            alamat: string (optional)
            fotoUrl: string (optional)
            lat: number (-90 to 90)
            lng: number (-180 to 180)
            kdkab: string
            kdkec: string
            kddesa: string
            kdsls: string (optional)
        response_schema:
          "201": Infrastruktur
          "400": Validation error
      - method: POST
        path: /api/infrastruktur/import
        description: Import infrastruktur from Excel file (admin)
        auth_required: true
        request_schema:
          multipart:
            file: Excel file (.xlsx)
        response_schema:
          "200":
            berhasil: number
            gagal: number
            errors: ImportError[]
          "400": Missing file or row limit exceeded
      - method: PUT
        path: /api/infrastruktur/:id
        description: Update infrastruktur entry (admin)
        auth_required: true
        request_schema:
          body:
            nama: string
            kategori: string
            lat: number
            lng: number
            kdkab: string
            kdkec: string
            kddesa: string
        response_schema:
          "200": Infrastruktur
          "400": Validation error
          "404": Not found
      - method: DELETE
        path: /api/infrastruktur/:id
        description: Delete infrastruktur entry (admin)
        auth_required: true
        response_schema:
          "200": Success message
          "404": Not found
    depends_on:
      - Authentication
      - Kategori Infrastruktur Management

  - name: Statistik Management
    description: CRUD operations for statistical data with filtering, pagination, Excel import/export
    files:
      - src/routes/statistik.ts
    endpoints:
      - method: GET
        path: /api/statistik
        description: List statistik with optional filters (kdkab, kdkec, kddesa, kdsls, tahun, indikator) and pagination
        auth_required: false
        response_schema:
          "200":
            data: Statistik[]
            total: number
      - method: GET
        path: /api/statistik/export
        description: Export statistik data to Excel file (admin)
        auth_required: true
        response_schema:
          "200": Excel file (.xlsx)
      - method: GET
        path: /api/statistik/:id
        description: Get single statistik record by ID
        auth_required: false
        response_schema:
          "200": Statistik
          "404": Not found
      - method: POST
        path: /api/statistik
        description: Create new statistik record (admin)
        auth_required: true
        request_schema:
          body:
            kdkab: string
            kdkec: string (optional)
            kddesa: string (optional)
            kdsls: string (optional)
            indikator: string
            nilai: number
            satuan: string (optional)
            tahun: number (2000-2100)
        response_schema:
          "201": Statistik
          "400": Validation error
      - method: POST
        path: /api/statistik/import
        description: Import statistik from Excel file (admin)
        auth_required: true
        request_schema:
          multipart:
            file: Excel file (.xlsx)
        response_schema:
          "200":
            berhasil: number
            gagal: number
            errors: ImportError[]
      - method: PUT
        path: /api/statistik/:id
        description: Update statistik record (admin)
        auth_required: true
        request_schema:
          body:
            kdkab: string
            indikator: string
            nilai: number
            tahun: number
        response_schema:
          "200": Statistik
          "404": Not found
      - method: DELETE
        path: /api/statistik/:id
        description: Delete statistik record (admin)
        auth_required: true
        response_schema:
          "200": Success message
          "404": Not found
    depends_on:
      - Authentication

  - name: Wilayah (Region) Lookup
    description: Lookup endpoints for administrative regions derived from infrastruktur and statistik data
    files:
      - src/routes/wilayah.ts
    endpoints:
      - method: GET
        path: /api/wilayah/kecamatan
        description: Get unique kecamatan list for a kabupaten
        auth_required: false
        request_schema:
          query:
            kdkab: string (required)
        response_schema:
          "200":
            - kdkec: string
              nama: string
          "400": Missing kdkab parameter
      - method: GET
        path: /api/wilayah/nagari
        description: Get unique nagari list for a kecamatan
        auth_required: false
        request_schema:
          query:
            kdkec: string (required)
        response_schema:
          "200":
            - kddesa: string
              nama: string
          "400": Missing kdkec parameter
      - method: GET
        path: /api/wilayah/korong
        description: Get unique korong list for a nagari
        auth_required: false
        request_schema:
          query:
            kddesa: string (required)
        response_schema:
          "200":
            - kdsls: string
              nama: string
          "400": Missing kddesa parameter

  - name: File Upload
    description: Photo upload and deletion for infrastruktur (admin only)
    files:
      - src/routes/upload.ts
    endpoints:
      - method: POST
        path: /api/upload/foto
        description: Upload infrastructure photo, returns public URL
        auth_required: true
        request_schema:
          multipart:
            foto: image file
        response_schema:
          "201":
            fotoUrl: string
            filename: string
            originalname: string
            size: number
            message: string
          "400": Missing file
      - method: DELETE
        path: /api/upload/foto/:filename
        description: Delete uploaded photo by filename
        auth_required: true
        response_schema:
          "200": Success message
          "400": Invalid filename
          "404": File not found
    depends_on:
      - Authentication

known_limitations:
  - issue: Wilayah names are derived from codes (e.g. "Kecamatan 130501") instead of real names from a reference table
    location: src/routes/wilayah.ts
    impact: Region names are not human-readable
  - issue: No rate limiting on public endpoints
    location: src/index.ts
    impact: Public endpoints could be abused
  - issue: JWT_SECRET must be set in environment; no fallback validation
    location: src/middleware/auth.ts
    impact: Server will crash if JWT_SECRET is undefined
